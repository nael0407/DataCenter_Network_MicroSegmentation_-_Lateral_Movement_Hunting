all:
  vars:
    ansible_user: dcadmin
    ansible_ssh_private_key_file: ~/.ssh/k8s-lab
    ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new'
  children:
    spines:
      vars:
        is_spine: true
      hosts:
        spine1:
          ansible_host: 192.168.122.21
          bgp_asn: 65000
          router_id: 10.255.0.1
          neighbors:
            - ip: 10.254.0.1
              asn: 65001
              desc: leaf1
            - ip: 10.254.0.3
              asn: 65002
              desc: leaf2
            - ip: 10.254.0.5
              asn: 65003
              desc: leaf3
        spine2:
          ansible_host: 192.168.122.22
          bgp_asn: 65000
          router_id: 10.255.0.2
          neighbors:
            - ip: 10.254.0.7
              asn: 65001
              desc: leaf1
            - ip: 10.254.0.9
              asn: 65002
              desc: leaf2
            - ip: 10.254.0.11
              asn: 65003
              desc: leaf3
    leaves:
      vars:
        is_spine: false
      hosts:
        leaf1:
          ansible_host: 192.168.122.31
          bgp_asn: 65001
          router_id: 10.255.0.11
          vnis:
            - 10010
          neighbors:
            - ip: 10.254.0.0
              asn: 65000
              desc: spine1
            - ip: 10.254.0.6
              asn: 65000
              desc: spine2
        leaf2:
          ansible_host: 192.168.122.32
          bgp_asn: 65002
          router_id: 10.255.0.12
          vnis:
            - 10020
          neighbors:
            - ip: 10.254.0.2
              asn: 65000
              desc: spine1
            - ip: 10.254.0.8
              asn: 65000
              desc: spine2
        leaf3:
          ansible_host: 192.168.122.33
          bgp_asn: 65003
          router_id: 10.255.0.13
          vnis:
            - 10010
            - 10020
            - 10030
            - 10040
            - 10050
          neighbors:
            - ip: 10.254.0.4
              asn: 65000
              desc: spine1
            - ip: 10.254.0.10
              asn: 65000
              desc: spine2
    workloads:
      vars:
        ansible_ssh_common_args: '-o StrictHostKeyChecking=accept-new -o ProxyJump=dcadmin@192.168.122.81'
      children:
        web_servers:
          vars:
            workload_role: web
            service_port: 80
          hosts:
            web1:
              ansible_host: 10.10.10.11
            web2:
              ansible_host: 10.10.10.12
        app_servers:
          vars:
            workload_role: app
            service_port: 8080
          hosts:
            app1:
              ansible_host: 10.10.20.11
            app2:
              ansible_host: 10.10.20.12
        db_servers:
          vars:
            workload_role: db
            service_port: 5432
          hosts:
            db1:
              ansible_host: 10.10.30.11
        canary_servers:
          vars:
            workload_role: canary
          hosts:
            canary1:
              ansible_host: 10.10.50.11

