---
- name: Pastikan daemons bgpd dan bfdd aktif di /etc/frr/daemons
  ansible.builtin.lineinfile:
    path: /etc/frr/daemons
    regexp: '^{{ item }}=.*'
    line: '{{ item }}=yes'
  loop:
    - bgpd
    - bfdd
  notify: Restart FRR

- name: Pastikan user dcadmin masuk ke grup frr dan frrvty
  ansible.builtin.user:
    name: dcadmin
    groups:
      - frr
      - frrvty
    append: true

- name: Konfigurasi kernel sysctl multipath L4 hash policy
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-ecmp.conf
    content: "net.ipv4.fib_multipath_hash_policy = 1\n"
    mode: '0644'
  notify: Reload sysctl

- name: Terapkan konfigurasi /etc/frr/frr.conf dari template
  ansible.builtin.template:
    src: frr.conf.j2
    dest: /etc/frr/frr.conf
    owner: frr
    group: frr
    mode: '0640'
  notify: Restart FRR
