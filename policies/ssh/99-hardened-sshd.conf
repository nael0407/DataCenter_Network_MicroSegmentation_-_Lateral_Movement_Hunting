# /etc/ssh/sshd_config.d/99-hardened-sshd.conf
# Pengerasan Keamanan Daemon SSH (OpenSSH Server Hardening)
# Proyek 4: Data Center Micro-segmentation & Lateral Movement Hunting
# Pemetaan Kontrol: MITRE ATT&CK T1563.001 (SSH Hijacking) & T1572 (Protocol Tunneling)

# 1. Nonaktifkan SSH Agent Forwarding (Mitigasi Skenario S3: T1563.001)
# Mencegah penyerang di server terkompromi memanfaatkan socket SSH_AUTH_SOCK yang tertinggal
AllowAgentForwarding no

# 2. Nonaktifkan TCP Port Forwarding (Mitigasi Skenario S4: T1572 & T1090)
# Mencegah pembuatan tunnel terenkripsi (-L / -R / -D) untuk menyamarkan lalu lintas tier lain
AllowTcpForwarding no

# 3. Nonaktifkan X11 Forwarding
X11Forwarding no

# 4. Batasi Percobaan Autentikasi Gagal
MaxAuthTries 3

# 5. Heartbeat & Deteksi Sesi Mati
ClientAliveInterval 300
ClientAliveCountMax 2
