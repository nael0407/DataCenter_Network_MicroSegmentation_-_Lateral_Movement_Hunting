{
    "device.node_id": "canary1-decoy",
    "ip.ignorelist": [ ],
    "logtype.ignorelist": [ ],
    "ftp.enabled": true,
    "ftp.port": 21,
    "ftp.banner": "FTP server ready",
    "http.enabled": true,
    "http.port": 80,
    "http.banner": "Apache/2.4.52 (Ubuntu)",
    "http.skin": "nasLogin",
    "http.log_redirect_request": true,
    "httpproxy.enabled": true,
    "httpproxy.port": 8080,
    "httpproxy.skin": "squid",
    "mysql.enabled": true,
    "mysql.port": 3306,
    "mysql.banner": "5.7.35-0ubuntu0.18.04.1",
    "redis.enabled": true,
    "redis.port": 6379,
    "telnet.enabled": true,
    "telnet.port": 23,
    "telnet.banner": "Ubuntu 22.04 LTS\nlogin: ",
    "ssh.enabled": true,
    "ssh.port": 2222,
    "ssh.version": "SSH-2.0-OpenSSH_8.9p1 Ubuntu-3ubuntu0.6",
    "logger": {
        "class": "PyLogger",
        "kwargs": {
            "formatters": {
                "plain": {
                    "format": "%(message)s"
                },
                "syslog_rfc": {
                    "format": "opencanaryd: %(message)s"
                }
            },
            "handlers": {
                "console": {
                    "class": "logging.StreamHandler",
                    "stream": "ext://sys.stdout"
                },
                "file": {
                    "class": "logging.FileHandler",
                    "filename": "/var/log/opencanary/opencanary.json"
                },
                "syslog": {
                    "class": "logging.handlers.SysLogHandler",
                    "address": "/dev/log",
                    "formatter": "syslog_rfc"
                }
            }
        }
    }
}
